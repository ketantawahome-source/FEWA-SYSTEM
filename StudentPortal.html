<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - FEWA Beauty & Fashion College</title>
    <!-- Error monitoring (Sentry): on only when a DSN is saved, see sentry.js -->
    <script src="sentry-config.js"></script>
    <script src="sentry.js"></script>
    <script src="db.js"></script>
    <script src="auth.js"></script>
    <script src="safe-actions.js"></script>
    <script src="backup.js?v=20261104f"></script>
    <script src="school-data.js"></script>
    <script src="notify.js"></script>
    <script>requireStudentLogin();</script>
    <link rel="stylesheet" href="styles.css?v=20261128g">
    <style>
        /* Unit Registration (online) */
        .reg-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
        .reg-period { font-size: 14px; color: #4b2a72; }
        .reg-help { color: #8a3b12; font-size: 13.5px; line-height: 1.6; margin: 10px 0; }
        .reg-closed { background: #fff4e5; border: 1px solid #f0c27b; color: #7a4a00; padding: 10px 14px; border-radius: 10px; margin: 10px 0; }
        .reg-bar { display: grid; grid-template-columns: 1.2fr 1fr auto; gap: 14px; align-items: end; background: #f1edf6;
            border-radius: 12px; padding: 16px; margin: 12px 0 16px; }
        .reg-label { display: block; font-weight: 700; font-size: 13px; color: #3b1d5e; margin-bottom: 6px; }
        .reg-course { color: #555; }
        .reg-bar select { width: 100%; }
        .reg-subtitle { font-weight: 700; font-size: 16px; color: #24103a; margin: 16px 0 8px; }
        .reg-tick { width: 44px; text-align: center; }
        .reg-tick input { width: 18px; height: 18px; margin: 0; }
        .reg-done { color: #1f7a4a; font-weight: 700; }
        .reg-actions-row { margin: 10px 0 4px; }
        .reg-registered { display: flex; flex-wrap: wrap; gap: 6px 10px; }
        .reg-registered span { background: #e8f5ee; color: #1f5f3d; border-radius: 999px; padding: 4px 10px; font-size: 13px; }
        .reg-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 18px 0 6px; }
        .reg-btn { border: none; border-radius: 8px; padding: 11px 10px; font-weight: 700; cursor: pointer; color: #fff; }
        .reg-btn.info { background: #4b2a72; }
        .reg-btn.main { background: #c0392b; }
        .reg-btn:disabled { opacity: .45; cursor: not-allowed; }
        .reg-total td { font-weight: 700; }
        .sp-notice { position: fixed; inset: 0; z-index: 3500; background: rgba(20, 8, 34, .55); display: flex; align-items: flex-start;
            justify-content: center; padding: 60px 16px 16px; }
        .sp-notice-box { background: #fff; border-radius: 10px; width: 100%; max-width: 640px; box-shadow: 0 18px 48px rgba(0,0,0,.3); overflow: hidden; }
        .sp-notice-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #e6e1ee;
            font-size: 19px; font-weight: 800; color: #24103a; }
        .sp-notice-x { background: none; border: none; font-size: 28px; line-height: 1; cursor: pointer; color: #555; }
        .sp-notice-body { padding: 26px 28px; font-size: 16px; line-height: 1.6; color: #b3261e; }
        .sp-notice-box.ok .sp-notice-body { color: #1f6b43; }
        .sp-notice-foot { display: flex; justify-content: flex-end; padding: 12px 20px; border-top: 1px solid #e6e1ee; }
        .sp-notice-close { background: #6c6577; color: #fff; border: none; border-radius: 6px; padding: 9px 20px; font-size: 15px; cursor: pointer; }
        .reg-box { border: 2px solid #7a5aa6; border-radius: 12px; padding: 16px; margin-top: 18px; }
        .reg-list-title { margin-top: 0; }
        .reg-view { background: #c0392b !important; color: #fff !important; border: none !important; white-space: nowrap; }
        .reg-units-row td { background: #f7f3fb; }
        .reg-units-list { margin: 4px 0; padding-left: 18px; line-height: 1.8; }
        @media (max-width: 700px) {
            .reg-bar, .reg-buttons { grid-template-columns: 1fr; }
            .reg-get { width: 100%; }
        }
    </style>
</head>

<body class="student-portal-page">
    <!-- Shown briefly while moving from one portal page to another -->
    <div id="spLoading" class="page-loading" hidden role="status" aria-live="polite">
        <div class="page-loading-box">
            <div class="page-loading-ring">
                <div class="page-loading-words">
                    <div class="page-loading-title">LOADING</div>
                    <div class="page-loading-text">please wait...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Laid out like the staff "Student Enquiry" window: the student and grouped links on the left, details on the right -->
    <div class="enquiry-window sp-shell">
        <!-- Top: the college brand above the sidebar, then a bar with the menu button, a search and the student's menu -->
        <div class="sp-header">
            <div class="sp-brand">
                <span class="brand-logo"><img src="fewa-logo.jpg" alt="" class="sp-logo"></span>
                <span class="brand-name" id="spCollege"><b>FEWA</b><small>BEAUTY &amp; FASHION COLLEGE</small></span>
            </div>
            <div class="sp-bar">
                <button type="button" class="btn-menu" onclick="toggleSideMenu()" title="Show or hide the menu names"
                    aria-label="Show or hide the menu names">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
                </button>
                <form class="sp-search" onsubmit="event.preventDefault(); searchPortal()">
                    <input type="text" id="spSearch" placeholder="Search..." aria-label="Search the portal" autocomplete="off">
                    <button type="submit" aria-label="Search">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
                    </button>
                </form>
                <!-- The student's photo and name; opens Profile / Logout -->
                <span class="sp-user-menu">
                    <button type="button" id="spUserButton" class="sp-user-button" aria-haspopup="true" aria-expanded="false"
                        onclick="toggleUserMenu()"></button>
                    <span id="spUserDropdown" class="sp-user-dropdown" hidden>
                        <button type="button" onclick="closeUserMenu(); showPortalTab('profile')">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.2-7 8-7s7 2.5 8 7"/></svg>
                            Profile</button>
                        <button type="button" onclick="closeUserMenu(); fewaConfirm('Log out of the Student Portal?').then(yes => { if (yes) studentLogout(); })">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/></svg>
                            Logout</button>
                    </span>
                </span>
            </div>
        </div>
        <div id="spBody" class="enquiry-body"></div>
        <div class="sp-phone-backdrop"></div>
        <footer class="system-footer sp-footer">
            <span><b>Copyright &copy; <span id="spYear"></span></b> <span class="footer-brand">WAFA Systems</span></span>
            <span>Student Portal</span>
        </footer>
    </div>

    <script>
        /* ---------- Student Portal ----------
           A student's own, read-only view, arranged like the staff Student Enquiry window. A temporary password
           (from "Reset Password" at the college office) must be replaced first: until then only Change Password shows. */
        let student = null;
                // What the college has charged and received (finance.mjs: the student's own statement only); null = not available
        let feeStatement = null;
        let feePayDetails = {};
        const money = n => 'KES ' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: Number(n) % 1 ? 2 : 0, maximumFractionDigits: 2 });
        const shortDate = iso => iso ? String(iso).slice(0, 10).split('-').reverse().join('/') : '';
        const METHOD_NAMES = { MPESA: 'M-Pesa', BANK: 'Bank', CASH: 'Cash', CHEQUE: 'Cheque' };
 
        function feesHtml() {
            const f = feeStatement;
            if (!f) return '<p class="empty-state">Your fee statement could not be loaded. Please try again later or ask the college accounts office.</p>';
            if (!f.charges.length && !f.payments.length) {
                return '<p class="empty-state">No fee records yet. Ask the college accounts office for your fee statement.</p>' + payHow();
            }
            const standing = f.balance > 0 ? `You owe <b>${money(f.balance)}</b>.` : f.balance < 0 ? `You have paid <b>${money(-f.balance)}</b> in advance.` : 'Your fees are fully paid.';
            const lines = [...f.charges.map(c => ({ at: c.createdAt, text: c.description + (c.term ? ` (${c.term})` : ''), debit: c.amount > 0 ? c.amount : 0, credit: c.amount < 0 ? -c.amount : 0 })),
                ...f.payments.map(p => ({ at: p.paidOn, text: `Payment ${p.receiptNo} - ${METHOD_NAMES[p.method] || p.method}${p.reference ? ' (' + p.reference + ')' : ''}`, debit: 0, credit: p.amount }))]
                .sort((a, b) => String(a.at).localeCompare(String(b.at)));
            let running = 0;
            return `<dl class="detail-grid">
                    <div><dt>Total Charged</dt><dd>${money(f.charged)}</dd></div><div><dt>Total Paid</dt><dd>${money(f.paid)}</dd></div>
                    <div><dt>Balance</dt><dd>${money(f.balance)}</dd></div></dl>
                <p>${standing}</p>
                <div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>Details</th><th>Charged</th><th>Paid</th><th>Balance</th></tr></thead><tbody>
                ${lines.map(l => { running = Math.round((running + l.debit - l.credit) * 100) / 100; return `<tr><td>${shortDate(l.at)}</td><td>${escapeHtml(l.text)}</td>
                    <td>${l.debit ? money(l.debit) : ''}</td><td>${l.credit ? money(l.credit) : ''}</td><td>${money(running)}</td></tr>`; }).join('')}
                </tbody></table></div>${payHow()}
                <div class="enquiry-actions"><button type="button" onclick="window.print()">Print Statement</button></div>`;
        }
 
        // How to pay: the college's M-Pesa and bank details (Settings > Fee Payment Details)
        function payHow() {
            const d = feePayDetails || {};
            const parts = [];
            if (d.mpesaPaybill) parts.push(`M-Pesa Paybill / Till <b>${escapeHtml(d.mpesaPaybill)}</b>, account <b>${escapeHtml(d.mpesaAccount || student.admNo)}</b>`);
            if (d.bankAccountNo) parts.push(`${escapeHtml(d.bankName || 'Bank')}${d.bankBranch ? ' ' + escapeHtml(d.bankBranch) : ''}, account name ${escapeHtml(d.bankAccountName || '')}, account no. <b>${escapeHtml(d.bankAccountNo)}</b>`);
            return parts.length ? `<div class="report-subtitle">How to Pay</div><p>${parts.join('<br>')}</p><p><small>Quote your AdmNo <b>${escapeHtml(student.admNo)}</b> as the reference. Payments appear here once the accounts office has recorded them.</small></p>` : '';
        }
        let documentFiles = [];
        let portalTab = 'profile';

        const PORTAL_ICONS = {
            profile: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.2-7 8-7s7 2.5 8 7"/>',
            overview: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/>',
            admission: '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/>',
            documents: '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
            status: '<path d="M4 20V4M4 20h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/>',
            family: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-6 6.5-6s5.9 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14c2.7 0 4.5 2 5 5"/>',
            fees: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
            password: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
            calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
            units: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7M8 11h7"/>',
            registration: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/><path d="M15 16l1.5 1.5L19 15"/>'
        };
        const icon = name => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PORTAL_ICONS[name]}</svg>`;

        // A heading and a grid of label / value pairs; '' when every value is empty and skipIfEmpty is set
        function detailSection(title, pairs, skipIfEmpty = false) {
            if (skipIfEmpty && !pairs.some(([, value]) => value)) return '';
            return `<div class="report-subtitle">${title}</div><dl class="detail-grid">${pairs.map(([label, value]) =>
                `<div><dt>${label}</dt><dd>${escapeHtml(value) || '—'}</dd></div>`).join('')}</dl>`;
        }

        // A white box; no title line when the page heading above already names it
        const box = (title, body, more = '') => `
            <div class="enquiry-box">
                ${title ? `<div class="enquiry-box-title">${title}</div>` : ''}
                <div class="enquiry-box-body">${body}</div>
                ${more ? `<div class="enquiry-box-more">${more}</div>` : ''}
            </div>`;

        // The page names shown beside the Home button
        const PAGE_NAMES = {
            profile: 'Personal Profile', overview: 'Overview', admission: 'Admission Details', documents: 'My Documents',
            status: 'Status History', family: 'Family & Contacts', fees: 'Fee Statement', password: 'Change Password', units: 'My Units', registration: 'Course Registration'
        };

        /* Moving to another page shows "LOADING please wait..." briefly, then the page.
           Staying on the same page (and the portal's own refreshes) shows no loading screen. */
        const PAGE_LOADING_MS = 550;
        let pageLoading = false;

        function showPortalTab(key) {
            if (key === portalTab || pageLoading) return openPortalPage(key);
            pageLoading = true;
            const loading = document.getElementById('spLoading');
            loading.hidden = false;
            setTimeout(() => {
                openPortalPage(key);
                loading.hidden = true;
                pageLoading = false;
            }, PAGE_LOADING_MS);
        }

        function openPortalPage(key) {
            portalTab = key;
            document.querySelectorAll('[data-portal-tab]').forEach(b => b.classList.toggle('active', b.dataset.portalTab === key));
            document.querySelectorAll('[data-portal-panel]').forEach(p => p.hidden = p.dataset.portalPanel !== key);
            // On every page, except the first, required password change (which cannot be skipped)
            const crumbs = document.getElementById('spCrumbs');
            crumbs.hidden = !!student.mustChangePassword;
            // Personal Profile is Home, so it keeps its heading but needs no Home button
            crumbs.querySelector('.sp-home').hidden = key === 'profile';
            document.getElementById('spCrumbPage').innerText = PAGE_NAMES[key] || '';
            document.querySelector('.enquiry-main').scrollTop = 0;
            if (key === 'password') document.getElementById('spNew').focus();
            if (key === 'registration' && regState && !regState.open) registrationClosedNotice();
        }

        /* The user menu at the top right: photo, name and ▾; opens Profile / Logout */
        function toggleUserMenu() {
            const dropdown = document.getElementById('spUserDropdown');
            dropdown.hidden = !dropdown.hidden;
            document.getElementById('spUserButton').setAttribute('aria-expanded', String(!dropdown.hidden));
        }

        function closeUserMenu() {
            document.getElementById('spUserDropdown').hidden = true;
            document.getElementById('spUserButton').setAttribute('aria-expanded', 'false');
        }

        document.addEventListener('click', event => {
            if (!event.target.closest('.sp-user-menu')) closeUserMenu();
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') closeUserMenu();
        });
        document.addEventListener('click', event => {
            const shell = document.querySelector('.sp-shell');
            if (!shell || !shell.classList.contains('phone-menu-open')) return;
            if (event.target.closest('.enquiry-nav') || event.target.classList.contains('sp-phone-backdrop')) {
                shell.classList.remove('phone-menu-open');
            }
        });

        // ≡ shrinks the sidebar to its icons, and back; remembered on this computer
        // On a phone (up to 768px wide) ≡ slides the menu in over the page instead; choosing a section, or
        // tapping the dimmed page beside it, closes it again
        function toggleSideMenu() {
            const shell = document.querySelector('.sp-shell');
            if (window.matchMedia('(max-width: 768px)').matches) return shell.classList.toggle('phone-menu-open');
            shell.classList.toggle('side-collapsed');
            try {
                localStorage.setItem('fewaPortalSideCollapsed', shell.classList.contains('side-collapsed') ? 'yes' : 'no');
            } catch { }
        }

        // Search: jumps to the first section of the portal whose name contains what was typed
        function searchPortal() {
            const typed = document.getElementById('spSearch').value.trim().toLowerCase();
            if (!typed) return;
            const match = [...document.querySelectorAll('.enquiry-nav')]
                .find(b => b.textContent.toLowerCase().includes(typed) || b.dataset.portalTab.includes(typed));
            if (match) {
                showPortalTab(match.dataset.portalTab);
                document.getElementById('spSearch').value = '';
            } else {
                showToast(`Nothing in the portal is called "${typed}". Try documents, status, contacts or password.`, 'warning');
            }
        }

        function showPasswordError(text) {
            const errorBox = document.getElementById('spPasswordError');
            errorBox.innerText = text;
            errorBox.hidden = false;
        }

        async function saveOwnPassword(event) {
            event.preventDefault();
            const password = document.getElementById('spNew').value;
            const missing = missingPasswordRules(password, student.admNo);
            if (missing.length) return showPasswordError('Password NOT saved. It needs: ' + missing.join(', ') + '.');
            if (password !== document.getElementById('spConfirm').value) return showPasswordError('Password NOT saved. The two passwords do not match.');
            const wasTemporary = student.mustChangePassword;
            let result;
            try {
                result = await setStudentPassword(student.id, password, false);
            } catch (error) {
                return showPasswordError('Password NOT saved. ' + error.message);
            }
            if (result === 'same') return showPasswordError('Password NOT saved. Choose a different password from the current one.');
            student.mustChangePassword = false;
            showToast('Your password has been saved. Use it next time you log in.');
            // The rest of the portal opens once a temporary password has been replaced
            if (wasTemporary) { render(); renderRegistration(); }
            else {
                event.target.reset();
                document.getElementById('spPasswordError').hidden = true;
                showPortalTab('profile');
            }
        }

        function viewDocument(index, download) {
            const doc = documentFiles[index];
            if (!doc || !doc.file) return;
            const url = URL.createObjectURL(doc.file);
            if (download) {
                const link = document.createElement('a');
                link.href = url;
                link.download = doc.fileName;
                link.click();
            } else {
                window.open(url, '_blank');
            }
            setTimeout(() => URL.revokeObjectURL(url), 60000);
        }

        let deferrals = [];

        /* ---------- Unit Registration (online) ----------
           The student registers their own units for the period open now (server/academics/online-registration.mjs):
           Get Units to Register lists the units on offer to them (by category), the ticked ones go to the Basket, and
           Complete Registration saves them (after a question) as the college's own unit registrations, which staff
           see at once in Manage Units. View Proforma Invoice shows the fee items of the period; Print Course
           Statement prints the units registered. The basket is kept only on the page until registration is completed. */
        let regState = null, regShown = false, regBasket = [], regProforma = null;
        const regCategory = () => (document.getElementById('regCategory') || {}).value || '';
        function renderRegistration() {
            const area = document.getElementById('regArea');
            if (!area || !student) return;
            const st = regState || { open: false, reason: 'Loading...' };
            const unitOf = code => (st.units || []).find(u => u.code === code) || {};
            const stage = u => st.short ? 'Whole course' : (u.yearOfStudy ? `Year ${u.yearOfStudy}` : '—');
            const sem = u => st.short ? '—' : (u.semester ? `Semester ${u.semester}` : '—');
            const available = (st.units || []).filter(u => !regCategory() || u.category === regCategory());
            const registered = (st.units || []).filter(u => u.registered);
            area.innerHTML = `
                ${registrationListHtml(st)}
                <div class="reg-box">
                <div class="reg-head">
                    <div class="portal-title">Course Registration</div>
                    <div class="reg-period">Registration Semester: <b>${st.open ? escapeHtml(st.termLabel) : 'closed'}</b>${st.open && st.closesOn ? `<br><small>Registration closes on ${longDate(st.closesOn)}</small>` : ''}</div>
                </div>
                ${st.open ? `<p class="reg-help">Click <b>Get Units to Register</b> to see the units of your course. Tick your units and click
                    <b>Add Selected Units to the Basket</b>, check them, then click <b>Complete Registration</b>. <b>View Proforma Invoice</b> shows the fees of this semester.</p>`
                    : st.feeBlocked ? `<p class="reg-closed">${registrationClosedText()}</p>`
                    : `<p class="reg-closed">${escapeHtml(st.reason || 'Registration is closed.')}</p>`}
                <div class="reg-bar">
                    <div><div class="reg-label">Current Course</div><div class="reg-course">${escapeHtml(st.course || student.admissionCourse || '')}</div></div>
                    <div><label class="reg-label" for="regCategory">Unit Category</label>
                        <select id="regCategory" onchange="regShown && renderRegistration()">
                            <option value="">All units</option><option>Course units</option><option>Common units</option>
                        </select></div>
                    <div><button type="button" class="btn-submit reg-get" onclick="regGetUnits()">Get Units to Register</button></div>
                </div>
                ${regShown ? `
                    <div class="reg-subtitle">Units of ${escapeHtml(st.course || 'your course')}${regCategory() ? ' - ' + escapeHtml(regCategory()) : ''}</div>
                    <div class="table-wrap"><table class="data-table reg-table">
                        <thead><tr><th class="reg-tick"></th><th>Unit</th><th>Unit Name</th><th>Credit Hours</th><th>Stage</th><th>Semester</th><th>Category</th></tr></thead>
                        <tbody>${available.length ? available.map(u => `<tr>
                            <td class="reg-tick">${u.registered ? '<span class="reg-done" title="Registered">&#10003;</span>'
                                : regBasket.includes(u.code) ? '<span class="reg-in" title="In the basket">&#128722;</span>'
                                : st.open ? `<input type="checkbox" class="reg-choose" value="${escapeHtml(u.code)}" aria-label="Choose ${escapeHtml(u.code)}">` : ''}</td>
                            <td>${escapeHtml(u.code)}</td><td>${escapeHtml(u.title)}</td><td>${escapeHtml(u.creditHours)}</td>
                            <td>${escapeHtml(stage(u))}</td><td>${escapeHtml(sem(u))}</td>
                            <td>${escapeHtml(u.category)}${u.registered ? ' <small class="reg-done">(registered)</small>' : ''}</td></tr>`).join('')
                            : `<tr class="empty-row"><td colspan="7">No ${regCategory() ? escapeHtml(regCategory().toLowerCase()) : 'units'} are set up for your course yet. The college office sets up the course units.</td></tr>`}</tbody>
                    </table></div>
                    ${st.open ? '<div class="reg-actions-row"><button type="button" class="btn-secondary" onclick="regAddToBasket()">Add Selected Units to the Basket</button></div>' : ''}` : ''}
                <div class="reg-subtitle">Basket Unit List</div>
                <div class="table-wrap"><table class="data-table reg-table">
                    <thead><tr><th>Course</th><th>Unit</th><th>Unit Name</th><th>Stage</th><th>Semester</th><th>Action</th></tr></thead>
                    <tbody>${regBasket.length ? regBasket.map(code => { const u = unitOf(code); return `<tr>

            ];
            portalTab = passwordOnly ? 'password' : (portalTab === 'password' ? 'profile' : portalTab);

            document.getElementById('spBody').innerHTML = `
                <aside class="enquiry-side">
                    ${nav.map(([heading, items]) => `
                        <div class="enquiry-nav-heading">${heading}</div>
                        ${items.map(([key, name]) => `<button type="button" class="enquiry-nav${key === portalTab ? ' active' : ''}"
                            data-portal-tab="${key}" onclick="showPortalTab('${key}')" title="${name}">${icon(key)}
                            <span class="nav-text">${name}</span></button>`).join('')}`).join('')}
                </aside>
                <main class="enquiry-main">
                    <!-- Back to Home (Personal Profile) from any other page -->
                    <div id="spCrumbs" class="sp-crumbs" hidden>
                        <button type="button" class="sp-home" onclick="showPortalTab('profile')">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg>
                            Home</button>
                        <span class="sp-crumb-sep" aria-hidden="true">&rsaquo;</span>
                        <span id="spCrumbPage"></span>
                    </div>
                    ${Object.entries(panels).map(([key, html]) => `<div class="portal-panel" data-portal-panel="${key}"
                        ${key === portalTab ? '' : 'hidden'}>${html}</div>`).join('')}
                </main>`;

            // The user menu shows the student's photo (or initials) and name
            document.getElementById('spUserButton').innerHTML = `${photo('sp-user-photo')}
                <span class="sp-user-name">${escapeHtml(fullName(s).toUpperCase())}</span>
                <svg class="sp-user-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`;

            if (s.photo) {
                const url = URL.createObjectURL(s.photo);
                document.querySelectorAll('img[data-photo]').forEach(img => img.src = url);
            }
            document.querySelectorAll('#spBody input[type="password"]').forEach(addPasswordEye);
            renderPasswordRules('spNew', 'spRules', s.admNo);
            document.getElementById('spNew').addEventListener('input', () => renderPasswordRules('spNew', 'spRules', s.admNo));
            showPortalTab(portalTab);
        }

        async function loadPortal() {
            student = (await readAll('students')).find(s => s.id === currentStudentId());
            // Removed or deactivated by the college office since logging in: sign out
            if (!student) {
                alert('Your student record is no longer available. Please contact the college office.');
                return studentLogout();
            }
            if (student.activeStudent === 'no') {
                alert('Your student account is no longer active. Please contact the college office.');
                return studentLogout();
            }

            const settings = await readAll('settings');
            const org = settings.find(s => s.key === 'organization');
            // The college name as in the staff sidebar: the first word large, the rest below it
            if (org && org.collegeName) {
                const [first, ...rest] = org.collegeName.trim().split(/\s+/);
                document.getElementById('spCollege').innerHTML = `<b>${escapeHtml(first)}</b><small>${escapeHtml(rest.join(' '))}</small>`;
            }
            if (org && org.logo) document.querySelector('.sp-logo').src = org.logo;
            try {
                // (not on a phone, where the menu slides in with its names)
                if (localStorage.getItem('fewaPortalSideCollapsed') === 'yes' && !window.matchMedia('(max-width: 768px)').matches) {
                    document.querySelector('.sp-shell').classList.add('side-collapsed');
                }
            } catch { }
            document.getElementById('spYear').innerText = new Date().getFullYear();

            documentFiles = (await readAll('documents')).filter(d => d.studentId === student.id)
                .sort((a, b) => b.uploadedAt.localeCompare(a.uploadedAt));
            deferrals = (await readAll('deferrals')).filter(d => d.studentId === student.id)
                .sort((a, b) => b.startDate.localeCompare(a.startDate));
            // My Units: the units the college registered the student on (Manage Units), with their titles
            myUnits = (await readAll('unit_registrations').catch(() => [])).filter(r => r.studentId === student.id);
            unitList = await readAll('units').catch(() => []);
            const courseSetting = settings.find(x => x.key === 'courses');
            myCourse = ((courseSetting && courseSetting.items) || []).find(c => (c.labelSuffix ? `${c.name} (${c.labelSuffix})` : c.name) === student.admissionCourse) || null;
                feeStatement = await api('GET', '/finance/my-statement').catch(() => null);
                regState = await api('GET', '/my-registration').catch(err => ({ open: false, reason: err.message }));
                feePayDetails = settings.find(s => s.key === 'paymentDetails') || {};
                render();
                renderRegistration();
        }

        loadPortal();

        /* Changes made by the college office show without refreshing: when staff save student data in another
           tab or window, or when the student comes back to this tab, the portal reads the latest details again.
           It waits while the student is typing a new password, so nothing they typed is lost. */
        let refreshTimer = null;
        function refreshPortal() {
            clearTimeout(refreshTimer);
            refreshTimer = setTimeout(() => {
                const typing = document.activeElement && document.activeElement.closest('.sp-password-form');
                if (typing) return;
                loadPortal();
            }, 300);
        }
        onDataChange(refreshPortal);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) refreshPortal();
        });
    </script>
</body>

</html>
