<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Global Settings - FEWA Beauty & Fashion College</title>
    <!-- The owner's hidden page, opened at /GLOBALSETTINGS (server.mjs, "Global Settings"). It is not linked from
         any other page. Everything here is checked again by the server; the page only shows the settings.
         Laid out as a settings table: SETTING_NAME | value | ticked when changed | description. -->
    <link rel="stylesheet" href="styles.css?v=20261126c">
    <script src="safe-actions.js"></script>
    <!-- The settings table's font: Source Sans 3, small and plain like a settings list -->
    <style>
        body.gs-open, body.gs-open input, body.gs-open select, body.gs-open textarea, body.gs-open button {
            font-family: 'Source Sans 3', 'Source Sans Pro', 'Segoe UI', Arial, sans-serif; }
        /* Once the password is right the page leaves the login look for a plain settings page */
        body.gs-open { background: var(--fewa-page); display: block; min-height: 100vh; margin: 0; }
        body.gs-open::before { display: none; }
        .gs-topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
            padding: 12px 20px; background: var(--fewa-purple); color: #fff; box-shadow: var(--fewa-shadow); }
        .gs-topbar h1 { margin: 0; font-size: 18px; color: var(--fewa-gold-light); letter-spacing: .5px; margin-right: auto; }
        .gs-search { flex: 1 1 260px; max-width: 520px; padding: 9px 14px; border: 0; border-radius: 8px; font: inherit; }
        .gs-search:focus { outline: none; box-shadow: var(--fewa-focus); }
        .gs-btn { padding: 9px 16px; border-radius: var(--fewa-radius-small); border: 1px solid var(--fewa-field); background: #fff;
            color: var(--fewa-ink); font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .gs-btn.main { background: var(--fewa-gold); border-color: var(--fewa-gold); color: var(--fewa-ink); }
        .gs-btn.danger { color: #b3261e; border-color: #e3a6a1; }
        .gs-btn:disabled { opacity: .5; cursor: default; }
        .gs-page { max-width: 1250px; margin: 0 auto; padding: 18px 20px 40px; }
        .gs-banner { display: none; margin-bottom: 14px; padding: 12px 14px; border-radius: var(--fewa-radius-small);
            background: #fdecea; color: #8a1c14; font-weight: 600; }
        .gs-status { min-height: 20px; margin: 0 0 10px; font-size: 14px; font-weight: 600; }
        .gs-status.ok { color: #2e7d32; } .gs-status.err { color: #b3261e; }
        .gs-card { background: #fff; border: 1px solid var(--fewa-line); border-radius: var(--fewa-radius); overflow: hidden;
            box-shadow: var(--fewa-shadow); margin-bottom: 22px; }
        .gs-card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
            padding: 12px 16px; border-bottom: 1px solid var(--fewa-line); }
        .gs-card-head h2 { margin: 0; font-size: 16px; color: var(--fewa-ink); }
        .gs-scroll { overflow-x: auto; }
        table.gs-table { width: 100%; border-collapse: collapse; font-size: 14px; font-weight: 400; color: #3a3a3a; }
        table.gs-table th { background: var(--fewa-ink); color: #fff; text-align: left; font-weight: 700; font-size: 14px;
            padding: 9px 12px; white-space: nowrap; }
        table.gs-table td { padding: 10px 12px; vertical-align: middle; border-top: 0; }
        table.gs-table tbody tr:nth-child(even) td { background: #f6f3fb; }
        table.gs-table tbody tr.changed td { background: var(--fewa-gold-tint); }
        .gs-key { white-space: nowrap; color: #3a3a3a; }
        .gs-value { width: 100%; min-width: 220px; box-sizing: border-box; padding: 7px 12px; border: 1px solid #ccc;
            border-radius: 3px; font-size: 14px; background: #fff; color: #555; }
        .gs-value:focus { outline: none; box-shadow: var(--fewa-focus); }
        textarea.gs-value { min-height: 42px; resize: vertical; }
        .gs-tick { width: 14px; height: 14px; accent-color: var(--fewa-ink); }
        .gs-desc { color: #3a3a3a; min-width: 260px; }
        .gs-topbar h1 { font-size: 17px; font-weight: 700; }
        .gs-btn, .gs-search { font-size: 14px; }
        .gs-card-head h2 { font-size: 15px; font-weight: 700; }
        .gs-form label { font-size: 14px; font-weight: 600; }
        .gs-empty { padding: 14px 16px; color: var(--fewa-muted); }
        .gs-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; padding: 16px; align-items: end; }
        .gs-form label { display: grid; gap: 6px; font-weight: 600; color: var(--fewa-ink); font-size: 14px; }
        @media (max-width: 640px) {
            .gs-topbar { padding: 12px 16px; }
            .gs-topbar h1 { width: 100%; }
            .gs-search { flex: 1 1 100%; max-width: none; }
            .gs-topbar .gs-btn { flex: 1 1 0; }
            .gs-page { padding: 14px 16px 30px; }
        }
    </style>
    <!-- Error monitoring (Sentry): on only when a DSN is saved, see sentry.js -->
    <script src="sentry-config.js"></script>
    <script src="sentry.js"></script>
</head>

<body class="login-page">
    <!-- 1. Password (or the first password, set by a logged-in Administrator) -->
    <div id="gate" class="login-card" hidden>
        <div class="login-logo-badge"><img class="login-logo" src="fewa-logo.jpg" alt="FEWA Beauty &amp; Fashion College"></div>
        <hr class="login-rule">
        <div class="login-title">Global Settings</div>
        <div id="gateText" class="login-subtitle"></div>
        <form id="gateForm" autocomplete="off">
            <div class="field">
                <label for="gatePassword">Global Settings password</label>
                <input type="password" id="gatePassword" autocomplete="current-password" required>
            </div>
            <!-- (style.display, not "hidden": the login page style shows every .field box) -->
            <div class="field" id="confirmField" style="display:none">
                <label for="gateConfirm">Type the password again</label>
                <input type="password" id="gateConfirm" autocomplete="new-password">
            </div>
            <div id="gateError" class="login-error" style="display:none"></div>
            <button type="submit" class="btn-login" id="gateButton">Open</button>
        </form>
    </div>

    <!-- 2. The settings table -->
    <div id="panel" hidden>
        <div class="gs-topbar">
            <h1>GLOBAL SETTINGS</h1>
            <input type="search" id="search" class="gs-search" placeholder="Search for a setting..." aria-label="Search for a setting">
            <button class="gs-btn main" id="saveButton" disabled>Save Settings</button>
            <button class="gs-btn" id="lockButton">Lock</button>
        </div>

        <div class="gs-page">
            <div id="closedBanner" class="gs-banner">The system is CLOSED: nobody can log in or use it until SYSTEM_OPEN is YES again.</div>
            <div id="status" class="gs-status" role="status" aria-live="polite"></div>

            <div class="gs-card">
                <div class="gs-scroll">
                    <table class="gs-table">
                        <thead><tr><th>Setting</th><th>Value</th><th title="Ticked when changed: Save Settings saves these">Changed</th><th>Description</th></tr></thead>
                        <tbody id="settingRows"></tbody>
                    </table>
                </div>
                <div id="noMatch" class="gs-empty" hidden>No setting matches the search.</div>
            </div>

            <div class="gs-card">
                <div class="gs-card-head">
                    <h2>Logged in now (<span id="sessionCount">0</span>)</h2>
                    <div style="display:flex; gap:8px; flex-wrap:wrap">
                        <button class="gs-btn" id="refreshButton">Refresh</button>
                        <button class="gs-btn danger" id="logoutAll">Log everyone out</button>
                    </div>
                </div>
                <div class="gs-scroll">
                    <table class="gs-table">
                        <thead><tr><th>Name</th><th>Login</th><th>Role</th><th>Logged in</th></tr></thead>
                        <tbody id="sessionRows"></tbody>
                    </table>
                </div>
                <div id="sessionNote" class="gs-empty" hidden>Nobody is logged in right now.</div>
            </div>

            <div class="gs-card">
                <div class="gs-card-head"><h2>Change the Global Settings password</h2></div>
                <form id="passwordForm" class="gs-form" autocomplete="off">
                    <label>Current password<input type="password" id="pwCurrent" class="gs-value" required></label>
                    <label>New password (at least 8 characters)<input type="password" id="pwNew" class="gs-value" minlength="8" required></label>
                    <label>Type the new password again<input type="password" id="pwConfirm" class="gs-value" minlength="8" required></label>
                    <div><button class="gs-btn main" type="submit">Change password</button></div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        let mode = 'login';
        let saved = {}; // the settings as the server has them

        /* The settings shown in the table: the server's name (control), the name shown, and what it does.
           yesNo: a YES / NO choice (stored as true / false); otherwise free text. off: asked before saving NO. */
        const SETTINGS = [
            { control: 'systemOpen', name: 'SYSTEM_OPEN', yesNo: true,
              description: 'YES: the system works as normal. NO: closes it for everyone (staff, students and online applications) and logs everyone out.',
              off: 'Close the whole system? Everyone is logged out and nobody can log in or apply until SYSTEM_OPEN is YES again.' },
            { control: 'closedMessage', name: 'SYSTEM_CLOSED_MESSAGE',
              description: 'The message people see while the system is closed. Empty: a standard maintenance message.' },
            { control: 'staffLogins', name: 'STAFF_LOGINS_ENABLED', yesNo: true,
              description: 'NO: staff cannot log in, and staff who are logged in are logged out.',
              off: 'Switch off staff logins? Staff who are logged in now are logged out.' },
            { control: 'studentLogins', name: 'STUDENT_PORTAL_ENABLED', yesNo: true,
              description: 'NO: students cannot log in to the Student Portal.',
              off: 'Close the Student Portal? Students who are logged in now are logged out.' },
            { control: 'applications', name: 'ONLINE_APPLICATIONS_ENABLED', yesNo: true,
              description: 'NO: the online application form says applications are closed.',
              off: 'Close online applications?' },
            { control: 'attendanceBackdating', name: 'ATTENDANCE_BACKDATING_ENABLED', yesNo: true,
              description: 'YES: Roll Call registers may be taken (or corrected) for past days, up to ATTENDANCE_BACKDATE_DAYS back. NO: only for today.',
              off: 'Switch off backdating of attendance? Registers can then only be taken or changed for today.' },
            { control: 'attendanceBackdateDays', name: 'ATTENDANCE_BACKDATE_DAYS', number: true,
              description: 'How many days back a register may be taken when ATTENDANCE_BACKDATING_ENABLED is YES (0 to 365), e.g. 7: today and the 7 days before it.' },
            { control: 'newSidebar', name: 'NEW_SIDEBAR_ENABLED', yesNo: true,
              description: 'YES: the new floating sidebar (menu search, glowing open item, Change Password and Log Out at the bottom). NO: the classic sidebar.',
              off: 'Go back to the classic sidebar? Staff see the change the next time they open or refresh a page.' },
            { control: 'shortCourses', name: 'SHORT_COURSES_ENABLED', yesNo: true,
              description: 'NO switches the short courses off: the Short Courses tab (Settings > Program Setup) and the short course choices on a course are hidden, short courses are not offered on the online application form, for new students (student form and Excel import) or in Course units. Students already on a short course keep it and their course still ends on time. Nothing saved is deleted.',
              off: 'Hide the short courses part? Staff see the change the next time they open or refresh a page.' }
        ].sort((a, b) => a.name.localeCompare(b.name));

        async function call(method, path, body) {
            const response = await fetch('/api/global/' + path, {
                method, credentials: 'same-origin',
                headers: { 'X-FEWA-Client': '1', ...(body ? { 'Content-Type': 'application/json' } : {}) },
                body: body ? JSON.stringify(body) : undefined
            });
            const data = await response.json().catch(() => ({}));
            if (response.status === 401) { showGate(true); throw new Error(data.error || 'Enter the password again.'); }
            if (!response.ok) throw new Error(data.error || 'Something went wrong. Please try again.');
            return data;
        }

        function status(text, ok = true) {
            $('status').textContent = text;
            $('status').className = 'gs-status ' + (ok ? 'ok' : 'err');
            if (text && ok) setTimeout(() => { if ($('status').textContent === text) $('status').textContent = ''; }, 3000);
        }

        function gateError(text) {
            $('gateError').textContent = text;
            $('gateError').style.display = text ? 'block' : 'none';
        }

        function showGate(passwordSet, canSetUp) {
            document.body.classList.remove('gs-open');
            document.body.classList.add('login-page');
            $('panel').hidden = true;
            $('gate').hidden = false;
            mode = passwordSet ? 'login' : canSetUp ? 'setup' : 'none';
            $('confirmField').style.display = mode === 'setup' ? '' : 'none';
            $('gateConfirm').required = mode === 'setup';
            $('gateForm').style.display = mode === 'none' ? 'none' : '';
            $('gateText').textContent = mode === 'login' ? 'Enter the Global Settings password.'
                : mode === 'setup' ? 'No Global Settings password yet. Choose one now (at least 8 characters). Keep it safe: it controls the whole system.'
                : 'Global Settings has not been set up yet. An Administrator must first log in to the system, then open this page again.';
            $('gateButton').textContent = mode === 'setup' ? 'Set password and open' : 'Open';
            $('gatePassword').autocomplete = mode === 'setup' ? 'new-password' : 'current-password';
            $('gatePassword').value = $('gateConfirm').value = '';
            if (mode !== 'none') $('gatePassword').focus();
        }

        const valueText = (s, value) => s.yesNo ? (value ? 'YES' : 'NO') : s.number ? String(Number(value) || 0) : String(value || '');

        // One row per setting: name | value | ticked when changed | description
        function drawSettings() {
            $('settingRows').replaceChildren(...SETTINGS.map(s => {
                const tr = document.createElement('tr');
                tr.dataset.search = (s.name + ' ' + s.description).toLowerCase();
                const name = document.createElement('td');
                name.className = 'gs-key';
                name.textContent = s.name;
                const valueCell = document.createElement('td');
                let input;
                if (s.yesNo) {
                    input = document.createElement('select');
                    for (const v of ['YES', 'NO']) input.add(new Option(v, v));
                } else if (s.number) {
                    input = document.createElement('input');
                    input.type = 'number';
                    input.min = '0';
                    input.max = '365';
                    input.step = '1';
                } else {
                    input = document.createElement('textarea');
                    input.maxLength = 500;
                    input.rows = 1;
                    input.placeholder = 'The system is closed for maintenance at the moment. Please try again later.';
                }
                input.className = 'gs-value';
                input.id = 'value-' + s.control;
                input.setAttribute('aria-label', s.name);
                input.value = valueText(s, saved[s.control]);
                valueCell.append(input);
                const tickCell = document.createElement('td');
                const tick = document.createElement('input');
                tick.type = 'checkbox';
                tick.className = 'gs-tick';
                tick.id = 'tick-' + s.control;
                tick.setAttribute('aria-label', 'Save ' + s.name);
                tickCell.append(tick);
                const desc = document.createElement('td');
                desc.className = 'gs-desc';
                desc.textContent = s.description;
                // Changing the value ticks the row; unticking puts the saved value back
                input.addEventListener('input', () => { tick.checked = input.value !== valueText(s, saved[s.control]); markChanged(); });
                tick.addEventListener('change', () => {
                    if (!tick.checked) input.value = valueText(s, saved[s.control]);
                    markChanged();
                });
                tr.append(name, valueCell, tickCell, desc);
                return tr;
            }));
            markChanged();
            filterRows();
        }

        function markChanged() {
            let any = false;
            for (const s of SETTINGS) {
                const ticked = $('tick-' + s.control).checked;
                $('tick-' + s.control).closest('tr').classList.toggle('changed', ticked);
                any = any || ticked;
            }
            $('saveButton').disabled = !any;
        }

        function filterRows() {
            const words = $('search').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
            let shown = 0;
            for (const tr of $('settingRows').rows) {
                const match = words.every(w => tr.dataset.search.includes(w));
                tr.hidden = !match;
                if (match) shown++;
            }
            $('noMatch').hidden = shown > 0;
        }

        function fmt(when) {
            return new Date(when).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        }

        function showPanel(state) {
            $('gate').hidden = true;
            $('panel').hidden = false;
            document.body.classList.remove('login-page');
            document.body.classList.add('gs-open');
            saved = state.controls;
            $('closedBanner').style.display = saved.systemOpen ? 'none' : 'block';
            drawSettings();
            const rows = state.signedInNow || [];
            $('sessionCount').textContent = rows.length;
            $('sessionRows').replaceChildren(...rows.map(r => {
                const tr = document.createElement('tr');
                for (const text of [r.name || '(unknown)', r.login, r.role, fmt(r.since)]) {
                    const td = document.createElement('td');
                    td.textContent = text;
                    tr.append(td);
                }
                return tr;
            }));
            $('sessionNote').hidden = rows.length > 0;
        }

        async function load() {
            try {
                const state = await call('GET', 'status');
                if (state.signedIn) showPanel(state); else showGate(state.passwordSet, state.canSetUp);
            } catch (err) {
                $('gate').hidden = false;
                gateError(err.message);
            }
        }

        $('gateForm').addEventListener('submit', async event => {
            event.preventDefault();
            gateError('');
            const password = $('gatePassword').value;
            try {
                if (mode === 'setup') {
                    if (password.length < 8) return gateError('The password must have at least 8 characters.');
                    if (password !== $('gateConfirm').value) return gateError('The two passwords are not the same.');
                    await call('POST', 'setup', { password });
                } else {
                    const result = await call('POST', 'login', { password });
                    if (result.result === 'locked') return gateError('Too many wrong tries. Wait 15 minutes, then try again.');
                    if (result.result !== 'ok') { $('gatePassword').value = ''; return gateError('Wrong password.'); }
                }
                load();
            } catch (err) { gateError(err.message); }
        });

        // Save Settings: the ticked rows only
        $('saveButton').addEventListener('click', async () => {
            const changes = {};
            const warnings = [];
            for (const s of SETTINGS) {
                if (!$('tick-' + s.control).checked) continue;
                const text = $('value-' + s.control).value;
                const value = s.yesNo ? text === 'YES' : s.number ? Number(text) : text.trim();
                if (s.number && !(Number.isInteger(value) && value >= 0 && value <= 365)) return status(`${s.name} must be a whole number from 0 to 365.`, false);
                changes[s.control] = value;
                if (s.yesNo && !value && saved[s.control] && s.off) warnings.push('- ' + s.off);
            }
            if (warnings.length && !await fewaConfirm(warnings.join('\n\n'))) return;
            $('saveButton').disabled = true;
            try {
                await call('PUT', 'controls', changes);
                status(`Saved ${Object.keys(changes).length} setting${Object.keys(changes).length === 1 ? '' : 's'}.`);
                load();
            } catch (err) { status(err.message, false); markChanged(); }
        });

        $('search').addEventListener('input', filterRows);
        $('refreshButton').addEventListener('click', load);
        $('logoutAll').addEventListener('click', async () => {
            if (!await fewaConfirm('Log out everyone who is logged in now (staff and students)?')) return;
            try { await call('POST', 'logout-everyone'); status('Everyone has been logged out.'); load(); } catch (err) { status(err.message, false); }
        });
        $('lockButton').addEventListener('click', async () => {
            await call('POST', 'logout').catch(() => { });
            load();
        });

        $('passwordForm').addEventListener('submit', async event => {
            event.preventDefault();
            if ($('pwNew').value !== $('pwConfirm').value) return status('The two new passwords are not the same.', false);
            try {
                const result = await call('POST', 'password', { current: $('pwCurrent').value, password: $('pwNew').value });
                if (result.result !== 'ok') return status('The current password is wrong.', false);
                event.target.reset();
                status('Password changed.');
            } catch (err) { status(err.message, false); }
        });

        load();
    </script>
</body>

</html>
